# Ceph 独立集群节点（与业务 K8s 分开，install-ceph.sh 读取）
#
# ---- 版本与仓库 ----
# reef = 18.2.x（推荐）；squid = 19.2.x
CEPH_RELEASE=reef
# 留空则用官方 download.ceph.com；国内可改清华/阿里
# CEPH_APT_MIRROR=https://mirrors.tuna.tsinghua.edu.cn/ceph/debian-reef
# 可选：钉死容器镜像（默认由 cephadm 按发行版拉取 quay.io/ceph/ceph）
# CEPH_IMAGE=
#
# RBD 池（给业务 K8s CSI 用）
RBD_POOL=kubernetes
RBD_PG_NUM=32
#
# 公网/集群网（MON 宣告地址用节点 IP；集群网可选，与节点同网段即可）
# CLUSTER_NETWORK=172.16.10.0/24
#
# Dashboard 初始密码（bootstrap 时写入；留空则 cephadm 随机生成并打印）
# DASHBOARD_PASSWORD=
#
# OSD：默认只用节点表第 6 列磁盘。若要「所有空闲盘」必须 OSD_ALLOW_ALL=1 且命令带 --all-available-devices
# OSD_ALLOW_ALL=0

# ---- 节点表 ----
# 格式: IP|主机名|角色|用户名|密码|osd磁盘
# 角色: bootstrap = 第一个 MON/MGR（只允许一行）；node = 其余 MON/OSD 节点
# osd磁盘: /dev/sdb 或 /dev/sdb,/dev/sdc ；留空则该节点不建 OSD
# 密码不要包含字符 |
# 权限建议: chmod 600 ceph-nodes.conf
#
# 改完后:
#   sudo bash install-ceph.sh hosts
#   sudo bash install-ceph.sh ssh-keys

172.16.10.131|ceph1|bootstrap|root|请改成真实密码|/dev/sdb
172.16.10.132|ceph2|node|root|请改成真实密码|/dev/sdb
172.16.10.133|ceph3|node|root|请改成真实密码|/dev/sdb
