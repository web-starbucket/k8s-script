
# 角色 bootstrap 仅一行；osd盘须独立空盘（如 /dev/vdb），禁止系统盘。密码勿含 |
# chmod 600 ceph-nodes.conf

CEPH_RELEASE=tentacle
# 国内镜像源
IMAGE_MIRROR=registry.cn-global.starbucket.com.cn/starbucket
# 下载源
# CEPH_APT_MIRROR=
# CEPH_IMAGE=
RBD_POOL=kubernetes
RBD_PG_NUM=32
# CLUSTER_NETWORK=172.16.10.0/24
# DASHBOARD_PASSWORD=
OSD_ALLOW_ALL=0
SKIP_MONITORING_STACK=0

# install-ceph.sh 读取。节点: IP|主机名|角色|用户|密码|osd盘
172.16.10.131|ceph1|bootstrap|root|请改成真实密码|/dev/sdb
