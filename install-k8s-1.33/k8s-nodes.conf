# Kubernetes 节点规划（含 SSH 账号，install-k8s-1.33.sh 自动读取）
# 格式: IP|主机名|角色|用户名|密码
# 角色: vip | master | worker
# vip 行用户/密码可留空；master/worker 必须填，供 ssh-keys 非交互互换密钥
# 密码不要包含字符 |
# 权限建议: chmod 600 k8s-nodes.conf
#
# 改完后:
#   sudo bash install-k8s-1.33.sh hosts
#   sudo bash install-k8s-1.33.sh ssh-keys
#   sudo bash install-k8s-1.33.sh vip-all

