apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apollo-portal
  namespace: prod
spec:
  parentRefs:
    - name: eg
      namespace: default
      sectionName: https
  hostnames:
    - apollo.obsbot.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: apollo-portal
          port: 8070
