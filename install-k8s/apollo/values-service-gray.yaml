# Kubernetes namespace gray maps to Apollo's built-in logical environment UAT.
# Apollo Service chart 0.12.0 / Apollo app 3.0.0.
# Protect this file: chart renders DB credentials into ConfigMaps/Helm release data.
configdb:
  host: mysql.default.svc.cluster.local
  port: 3306
  dbName: ApolloConfigDB_GRAY
  userName: apollo_gray
  password: CHANGE_ME
  connectionStringProperties: characterEncoding=utf8&useSSL=false
  service:
    enabled: false
configService:
  replicaCount: 2
  image:
    tag: "3.0.0"
  config:
    profiles: "github,kubernetes"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: apollo-service-gray-apollo-configservice
adminService:
  replicaCount: 2
  image:
    tag: "3.0.0"
  config:
    profiles: "github,kubernetes"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: apollo-service-gray-apollo-adminservice
