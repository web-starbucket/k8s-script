# 故障转移：当前主不可用 → 升备库；谁升主就一直当主，不回切
# Service/postgres / TCPRoute 跟随 postgres.role=primary
# 检测：Pod Watch + TCP 短连接探测；切主后 topology/从库重建异步对齐
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-controller
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-controller
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-controller
subjects:
  - kind: ServiceAccount
    name: postgres-controller
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-controller
  namespace: default
data:
  run.sh: |
    #!/bin/bash
    set -uo pipefail
    NS="${NAMESPACE:-default}"
    FAIL_AFTER="${FAIL_AFTER:-0}"
    INTERVAL="${INTERVAL:-0.15}"
    REPLICA_GRACE_SEC="${REPLICA_GRACE_SEC:-120}"
    RESYNC_FAILS="${RESYNC_FAILS:-3}"
    RESYNC_COOLDOWN_SEC="${RESYNC_COOLDOWN_SEC:-300}"
    DB="${POSTGRES_DB:-}"
    USER="${POSTGRES_USER:-}"
    PW="${POSTGRES_PASSWORD:-}"
    REPL_PW="${POSTGRES_REPLICATION_PASSWORD:-}"
    STATE="/tmp/postgres-ctl"
    CACHE="${STATE}/pods.cache"
    FIFO="${STATE}/event"
    PRIMARY_FILE="${STATE}/primary"

    mkdir -p "${STATE}"
    : > "${CACHE}"
    rm -f "${FIFO}"
    mkfifo "${FIFO}"
    exec 6<>"${FIFO}"

    log() { echo "[$(date -u +%H:%M:%S)] $*"; }

    now_ms() {
      local t
      t="$(date +%s%3N 2>/dev/null || true)"
      if [[ "${t}" =~ ^[0-9]{13}$ ]]; then echo "${t}"; return; fi
      t="$(python3 -c 'import time;print(int(time.time()*1000))' 2>/dev/null || true)"
      if [[ "${t}" =~ ^[0-9]+$ ]]; then echo "${t}"; return; fi
      echo "$(($(date +%s) * 1000))"
    }

    secret_b64() {
      local sec="$1" key="$2"
      kubectl -n "${NS}" get secret "${sec}" -o "jsonpath={.data.${key}}" 2>/dev/null || true
    }
    [[ -z "${DB}" ]] && DB="$(secret_b64 postgres-auth POSTGRES_DB | base64 -d 2>/dev/null || true)"
    [[ -z "${USER}" ]] && USER="$(secret_b64 postgres-auth POSTGRES_USER | base64 -d 2>/dev/null || true)"
    [[ -z "${PW}" ]] && PW="$(secret_b64 postgres-auth POSTGRES_PASSWORD | base64 -d 2>/dev/null || true)"
    [[ -z "${REPL_PW}" ]] && REPL_PW="$(secret_b64 postgres-auth replication-password | base64 -d 2>/dev/null || true)"
    if [[ -z "${DB}" || -z "${USER}" || -z "${PW}" || -z "${REPL_PW}" ]]; then
      log "ERROR 缺少 postgres-auth：POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD/replication-password"
      log "修复: kubectl apply -f postgres.yaml && kubectl apply -f postgres-controller.yaml && kubectl rollout restart deploy/postgres-controller"
      kubectl -n "${NS}" get secret postgres-auth -o jsonpath='{.data}' 2>/dev/null; echo
      sleep 30
      exit 1
    fi

    down_since_ms=""
    last_status=""
    PRIMARY=""
    promoting=0
    bg_pid=""
    PAUSE_ENSURE="${STATE}/pause_ensure"
    declare -A repl_fail=()
    declare -A repl_resync_at=()
    declare -A repl_ready_since=()

    notify() { echo x >&6 2>/dev/null || true; }

    pause_ensure() {
      : > "${PAUSE_ENSURE}"
      if [[ -n "${bg_pid:-}" ]] && kill -0 "${bg_pid}" 2>/dev/null; then
        kill "${bg_pid}" 2>/dev/null || true
        wait "${bg_pid}" 2>/dev/null || true
      fi
      bg_pid=""
    }

    resume_ensure() { rm -f "${PAUSE_ENSURE}"; }

    dump_pods() {
      local tmp="${CACHE}.tmp.$$.$RANDOM"
      if ! kubectl -n "${NS}" get pods -l app=postgres -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.podIP}{"\t"}{.status.phase}{"\t"}{.metadata.deletionTimestamp}{"\t"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
        > "${tmp}" 2>/dev/null; then
        rm -f "${tmp}"
        return 1
      fi
      mv -f "${tmp}" "${CACHE}"
    }

    pod_row() { awk -F'\t' -v p="$1" '$1==p {print; exit}' "${CACHE}" 2>/dev/null; }
    pod_ip() { pod_row "$1" | cut -f2; }

    list_postgres() {
      local names
      names="$(awk -F'\t' 'NF && $1!=""{print $1}' "${CACHE}" 2>/dev/null | sort)"
      if [[ -n "${names}" ]]; then echo "${names}"; return; fi
      kubectl -n "${NS}" get pods -l app=postgres \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | sort || true
    }

    cm_get() {
      kubectl -n "${NS}" get cm postgres-topology -o jsonpath="{.data.$1}" 2>/dev/null | tr -d '[:space:]'
    }

    current_pod() { echo "${PRIMARY}"; }

    load_primary() {
      local p
      p="$(cm_get primary-pod)"
      PRIMARY="${p:-postgres-0}"
      echo "${PRIMARY}" > "${PRIMARY_FILE}"
    }

    set_primary_pod() {
      kubectl -n "${NS}" patch cm postgres-topology --type merge \
        -p "{\"data\":{\"primary-pod\":\"$1\"}}" >/dev/null
    }

    pod_ready() {
      local row
      row="$(pod_row "$1")"
      [[ -n "${row}" ]] || return 1
      [[ "$(echo "${row}" | cut -f5)" == "True" ]]
    }

    pod_running() {
      local row phase del ip
      row="$(pod_row "$1")"
      [[ -n "${row}" ]] || return 1
      ip="$(echo "${row}" | cut -f2)"
      phase="$(echo "${row}" | cut -f3)"
      del="$(echo "${row}" | cut -f4)"
      [[ "${phase}" == "Running" ]] || return 1
      [[ -z "${del}" ]] || return 1
      [[ -n "${ip}" ]] || return 1
    }

    pg_ready() {
      kubectl -n "${NS}" exec "$1" -c postgres -- \
        pg_isready -U "${USER}" -d "${DB}" >/dev/null 2>&1
    }

    psql_q() {
      kubectl -n "${NS}" exec "$1" -c postgres -- \
        psql -U "${USER}" -d "${DB}" -tA -c "$2" 2>/dev/null \
        | tr -d '\r\n' || true
    }

    pg_alive() { pod_ready "$1" && pg_ready "$1"; }

    primary_healthy() {
      local p="$1"
      pod_running "${p}" || return 1
      pg_ready "${p}"
    }

    pg_tcp_probe() {
      local ip="$1"
      [[ -n "${ip}" ]] || return 1
      timeout 1 bash -c '
        ip="$0"
        exec 3<>/dev/tcp/"$ip"/5432 || exit 1
      ' "${ip}" 2>/dev/null
    }

    track_replica_ready() {
      local p="$1" now
      now="$(date +%s)"
      if pod_running "${p}"; then
        [[ -n "${repl_ready_since[$p]:-}" ]] || repl_ready_since[$p]="${now}"
      else
        unset 'repl_ready_since[$p]'
      fi
    }

    replica_in_grace() {
      local p="$1" since now
      since="${repl_ready_since[$p]:-}"
      [[ -n "${since}" ]] || return 0
      now="$(date +%s)"
      (( now - since < REPLICA_GRACE_SEC ))
    }

    is_standby() {
      [[ "$(psql_q "$1" "SELECT pg_is_in_recovery();")" == "t" ]]
    }

    replica_on_primary() {
      local pri="$1" rep="$2" ip state
      ip="$(pod_ip "${rep}")"
      [[ -n "${ip}" ]] || return 1
      state="$(psql_q "${pri}" "SELECT COALESCE(state,'') FROM pg_stat_replication WHERE client_addr = '${ip}'::inet LIMIT 1;")"
      [[ "${state}" == "streaming" ]]
    }

    replica_healthy() {
      local pri="$1" rep="$2"
      is_standby "${rep}" || return 1
      replica_on_primary "${pri}" "${rep}" || return 1
      return 0
    }

    set_role() {
      local p="$1" want="$2" cur
      cur="$(kubectl -n "${NS}" get pod "${p}" -o jsonpath='{.metadata.labels.postgres\.role}' 2>/dev/null || true)"
      [[ "${cur}" == "${want}" ]] && return 0
      kubectl -n "${NS}" label pod "${p}" "postgres.role=${want}" --overwrite >/dev/null 2>&1 || true
    }

    resync_replica() {
      local pod="$1" src="$2" now last
      now="$(date +%s)"
      last="${repl_resync_at[$pod]:-0}"
      if (( now - last < RESYNC_COOLDOWN_SEC )); then
        log "跳过重建  ${pod} 冷却中 $((RESYNC_COOLDOWN_SEC - now + last))s"
        return 0
      fi
      repl_resync_at[$pod]="${now}"
      repl_fail[$pod]=0
      unset 'repl_ready_since[$pod]'
      log "重建从库  ${pod} → ${src}.postgres-headless（删除 Pod 触发 pg_basebackup/pg_rewind）"
      kubectl -n "${NS}" delete pod "${pod}" --wait=false >/dev/null 2>&1 || true
    }

    promote_postgres() {
      local cand="$1"
      if is_standby "${cand}"; then
        psql_q "${cand}" "SELECT pg_promote();" >/dev/null || true
        sleep 2
      fi
    }

    async_align() {
      local cand="$1" p
      set_primary_pod "${cand}" || log "warn 更新 postgres-topology 失败"
      dump_pods || true
      for p in $(list_postgres); do
        [[ -n "${p}" && "${p}" != "${cand}" ]] || continue
        set_role "${p}" replica
        resync_replica "${p}" "${cand}"
      done
      log "异步配置已更新  topology=${cand}  从库重建已触发"
    }

    promote_to() {
      local cand="$1" old="$2" t1 ms
      [[ "${promoting}" == "0" ]] || return 0
      promoting=1
      pause_ensure
      log "故障切换  ${old:-?} → ${cand}"
      promote_postgres "${cand}" || log "warn pg_promote 未确认成功，仍切换 Service 标签"
      set_role "${cand}" primary
      PRIMARY="${cand}"
      echo "${cand}" > "${PRIMARY_FILE}"
      t1="$(now_ms)"
      ms=$((t1 - down_since_ms))
      (( ms < 0 )) && ms=0
      log "切主成功  主=${cand}  故障开始→切主成功 ${ms}ms"
      down_since_ms=""
      last_status=""
      (
        async_align "${cand}" || true
        resume_ensure
      ) &
      promoting=0
    }

    pick_standby() {
      local old p
      old="$(current_pod)"
      dump_pods || true
      for p in $(list_postgres); do
        [[ -n "${p}" && "${p}" != "${old}" ]] || continue
        if pod_running "${p}" && pg_ready "${p}" && is_standby "${p}"; then
          echo "${p}"
          return 0
        fi
      done
      for p in $(list_postgres); do
        [[ -n "${p}" && "${p}" != "${old}" ]] || continue
        if pod_running "${p}" && pg_ready "${p}"; then
          echo "${p}"
          return 0
        fi
      done
      return 1
    }

    replica_line() {
      local pod="$1" cur st host pri_state
      cur="$(current_pod)"
      if ! pod_ready "${pod}"; then echo "复制=无法查询"; return; fi
      if ! is_standby "${pod}"; then echo "复制=未配置"; return; fi
      st="$(psql_q "${pod}" "SELECT COALESCE(status,'') FROM pg_stat_wal_receiver LIMIT 1;")"
      host="$(psql_q "${pod}" "SELECT COALESCE(sender_host,'') FROM pg_stat_wal_receiver LIMIT 1;")"
      pri_state="$(psql_q "${cur}" "SELECT COALESCE(state,'') FROM pg_stat_replication WHERE client_addr = '$(pod_ip "${pod}")'::inet LIMIT 1;")"
      if [[ "${st}" == "streaming" && "${pri_state}" == "streaming" ]]; then
        echo "复制=正常 status=${st} 源=${host:-unknown}"
      else
        echo "复制=异常 status=${st:-none} 主看=${pri_state:-none} 源=${host:-none}"
      fi
    }

    print_roles() {
      local cur p ready rpl line
      cur="$(current_pod)"
      line="主 ${cur}"
      for p in $(list_postgres); do
        [[ -n "${p}" ]] || continue
        if pod_running "${p}"; then ready="Ready"; else ready="NotReady"; fi
        if [[ "${p}" == "${cur}" ]]; then
          line="${line} ${ready}"
        else
          rpl="$(replica_line "${p}")"
          line="${line}  |  从 ${p} ${ready} ${rpl}"
        fi
      done
      if [[ "${line}" != "${last_status}" ]]; then
        log "${line}"
        last_status="${line}"
      fi
    }

    ensure_replicas() {
      local cur p fails want
      [[ -f "${PAUSE_ENSURE}" ]] && return 0
      cur="$(current_pod)"
      want="$(cat "${PRIMARY_FILE}" 2>/dev/null || echo "${cur}")"
      [[ "${cur}" == "${want}" ]] || return 0
      primary_healthy "${cur}" || return 0
      for p in $(list_postgres); do
        [[ -n "${p}" && "${p}" != "${cur}" ]] || continue
        [[ -f "${PAUSE_ENSURE}" ]] && return 0
        track_replica_ready "${p}"
        pod_running "${p}" || continue
        if replica_in_grace "${p}"; then
          repl_fail[$p]=0
          continue
        fi
        if replica_healthy "${cur}" "${p}"; then
          repl_fail[$p]=0
          continue
        fi
        fails=$(( ${repl_fail[$p]:-0} + 1 ))
        repl_fail[$p]="${fails}"
        [[ -f "${PAUSE_ENSURE}" ]] && return 0
        [[ "$(cat "${PRIMARY_FILE}" 2>/dev/null)" == "${cur}" ]] || return 0
        primary_healthy "${cur}" || return 0
        log "ensure ${p} 复制未就绪 ${fails}/${RESYNC_FAILS} standby=$(is_standby "${p}" && echo t || echo f) 主库state=$(psql_q "${cur}" "SELECT COALESCE(state,'') FROM pg_stat_replication WHERE client_addr = '$(pod_ip "${p}")'::inet LIMIT 1;")"
        if (( fails >= RESYNC_FAILS )); then
          resync_replica "${p}" "${cur}"
        fi
      done
    }

    maybe_bg() {
      [[ -f "${PAUSE_ENSURE}" ]] && return 0
      if [[ -n "${bg_pid}" ]] && kill -0 "${bg_pid}" 2>/dev/null; then
        return 0
      fi
      (
        [[ -f "${PAUSE_ENSURE}" ]] && exit 0
        print_roles || true
        ensure_replicas || true
      ) &
      bg_pid=$!
    }

    watch_pods() {
      while true; do
        dump_pods || true
        notify
        kubectl -n "${NS}" get pods -l app=postgres --watch -o name 2>/dev/null |
        while IFS= read -r _; do
          dump_pods || true
          notify
        done
        sleep 0.2
      done
    }

    tcp_probe() {
      local cur ip fails=0
      while true; do
        cur="$(cat "${PRIMARY_FILE}" 2>/dev/null || true)"
        ip="$(pod_ip "${cur}")"
        if [[ -z "${cur}" || -z "${ip}" ]]; then
          fails=0
          sleep 0.1
          continue
        fi
        if pg_tcp_probe "${ip}"; then
          fails=0
        else
          fails=$((fails + 1))
          if (( fails >= 2 )); then
            log "TCP 探测失败  ${cur} ${ip}"
            dump_pods || true
            notify
            fails=0
          fi
        fi
        sleep "${INTERVAL}"
      done
    }

    check_failover() {
      local cur now cand fail_ms
      cur="$(current_pod)"
      if primary_healthy "${cur}"; then
        down_since_ms=""
        resume_ensure
        maybe_bg
        return 0
      fi
      now="$(now_ms)"
      if [[ -z "${down_since_ms}" ]]; then
        down_since_ms="${now}"
        last_status=""
        pause_ensure
        log "主库不可用  ${cur}  故障开始"
      fi
      fail_ms=$((FAIL_AFTER * 1000))
      if (( now - down_since_ms < fail_ms )); then
        log "等待升主  $((now - down_since_ms))/${fail_ms}ms"
        return 0
      fi
      cand="$(pick_standby || true)"
      if [[ -n "${cand}" ]]; then
        log "主库不可用，升主 ${cand}"
        promote_to "${cand}" "${cur}" || true
      else
        log "无可用备库可升主"
      fi
    }

    trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

    load_primary
    resume_ensure
    dump_pods || true
    watch_pods &
    tcp_probe &

    log "启动  ns=${NS}  fail_after=${FAIL_AFTER}s  interval=${INTERVAL}s  grace=${REPLICA_GRACE_SEC}s  主=${PRIMARY}  策略=Watch+TCP探测即时升主，配置异步对齐"
    while true; do
      check_failover || true
      read -t "${INTERVAL}" -r -u 6 _ || true
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-controller
  template:
    metadata:
      labels:
        app: postgres-controller
    spec:
      serviceAccountName: postgres-controller
      containers:
        - name: controller
          image: registry.cn-global.starbucket.com.cn/starbucket/docker.io/alpine/k8s:1.33.1
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/run.sh"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FAIL_AFTER
              value: "0"
            - name: INTERVAL
              value: "0.15"
            - name: REPLICA_GRACE_SEC
              value: "120"
            - name: RESYNC_FAILS
              value: "3"
            - name: RESYNC_COOLDOWN_SEC
              value: "300"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB
                  optional: true
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: replication-password
                  optional: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: postgres-controller
            defaultMode: 0755
