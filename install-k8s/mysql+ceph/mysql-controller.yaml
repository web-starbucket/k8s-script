# 故障转移：当前主不可用 → 升从库；谁升主就一直当主，不回切
# Service/mysql / TCPRoute 跟随 mysql.role=primary
# 检测：Pod Watch + TCP 短连接探测；切主后 topology/从库指向异步对齐
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mysql-controller
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mysql-controller
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mysql-controller
subjects:
  - kind: ServiceAccount
    name: mysql-controller
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-controller
  namespace: default
data:
  run.sh: |
    #!/bin/bash
    set -uo pipefail
    NS="${NAMESPACE:-default}"
    FAIL_AFTER="${FAIL_AFTER:-0}"
    INTERVAL="${INTERVAL:-0.15}"
    PW="${MYSQL_ROOT_PASSWORD:-}"
    REPL_PW="${MYSQL_REPLICATION_PASSWORD:-}"
    STATE="/tmp/mysql-ctl"
    CACHE="${STATE}/pods.cache"
    FIFO="${STATE}/event"
    PRIMARY_FILE="${STATE}/primary"

    mkdir -p "${STATE}"
    : > "${CACHE}"
    rm -f "${FIFO}"
    mkfifo "${FIFO}"
    exec 6<>"${FIFO}"

    log() { echo "[$(date -u +%H:%M:%S)] $*"; }

    now_ms() {
      local t
      t="$(date +%s%3N 2>/dev/null || true)"
      if [[ "${t}" =~ ^[0-9]{13}$ ]]; then echo "${t}"; return; fi
      t="$(python3 -c 'import time;print(int(time.time()*1000))' 2>/dev/null || true)"
      if [[ "${t}" =~ ^[0-9]+$ ]]; then echo "${t}"; return; fi
      echo "$(($(date +%s) * 1000))"
    }

    secret_b64() {
      local sec="$1" key="$2"
      kubectl -n "${NS}" get secret "${sec}" -o "jsonpath={.data.${key}}" 2>/dev/null || true
    }
    if [[ -z "${PW}" ]]; then
      PW="$(secret_b64 mysql-auth root-password | base64 -d 2>/dev/null || true)"
    fi
    if [[ -z "${REPL_PW}" ]]; then
      REPL_PW="$(secret_b64 mysql-auth replication-password | base64 -d 2>/dev/null || true)"
    fi
    if [[ -z "${REPL_PW}" ]]; then
      for k in replication-password repl-password mysql-replication-password; do
        REPL_PW="$(secret_b64 mysql-auth "${k}" | base64 -d 2>/dev/null || true)"
        [[ -n "${REPL_PW}" ]] && break
      done
    fi
    if [[ -z "${PW}" || -z "${REPL_PW}" ]]; then
      log "ERROR 缺少 root/replication 密码。Secret mysql-auth 需要 key: root-password + replication-password"
      log "修复: kubectl apply -f mysql.yaml && kubectl apply -f mysql-controller.yaml && kubectl rollout restart deploy/mysql-controller"
      kubectl -n "${NS}" get secret mysql-auth -o jsonpath='{.data}' 2>/dev/null; echo
      sleep 30
      exit 1
    fi

    down_since_ms=""
    last_status=""
    PRIMARY=""
    promoting=0
    bg_pid=""
    PAUSE_ENSURE="${STATE}/pause_ensure"
    CONNECT_WATCH="${STATE}/connect_watch"
    CONNECT_WM="${STATE}/connect_wm"

    notify() { echo x >&6 2>/dev/null || true; }

    pause_ensure() {
      : > "${PAUSE_ENSURE}"
      if [[ -n "${bg_pid:-}" ]] && kill -0 "${bg_pid}" 2>/dev/null; then
        kill "${bg_pid}" 2>/dev/null || true
        wait "${bg_pid}" 2>/dev/null || true
      fi
      bg_pid=""
    }

    resume_ensure() { rm -f "${PAUSE_ENSURE}"; }

    dump_pods() {
      local tmp="${CACHE}.tmp.$$.$RANDOM"
      if ! kubectl -n "${NS}" get pods -l app=mysql -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.podIP}{"\t"}{.status.phase}{"\t"}{.metadata.deletionTimestamp}{"\t"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
        > "${tmp}" 2>/dev/null; then
        rm -f "${tmp}"
        return 1
      fi
      mv -f "${tmp}" "${CACHE}"
    }

    pod_row() { awk -F'\t' -v p="$1" '$1==p {print; exit}' "${CACHE}" 2>/dev/null; }
    pod_ip() { pod_row "$1" | cut -f2; }

    list_mysql() {
      local names
      names="$(awk -F'\t' 'NF && $1!=""{print $1}' "${CACHE}" 2>/dev/null | sort)"
      if [[ -n "${names}" ]]; then echo "${names}"; return; fi
      kubectl -n "${NS}" get pods -l app=mysql \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | sort || true
    }

    cm_get() {
      kubectl -n "${NS}" get cm mysql-topology -o jsonpath="{.data.$1}" 2>/dev/null | tr -d '[:space:]'
    }

    current_pod() { echo "${PRIMARY}"; }

    load_primary() {
      local p
      p="$(cm_get primary-pod)"
      PRIMARY="${p:-mysql-0}"
      echo "${PRIMARY}" > "${PRIMARY_FILE}"
    }

    set_primary_pod() {
      kubectl -n "${NS}" patch cm mysql-topology --type merge \
        -p "{\"data\":{\"primary-pod\":\"$1\"}}" >/dev/null
    }

    pod_ready() {
      local row
      row="$(pod_row "$1")"
      [[ -n "${row}" ]] || return 1
      [[ "$(echo "${row}" | cut -f5)" == "True" ]]
    }

    pod_running() {
      local row phase del ip
      row="$(pod_row "$1")"
      [[ -n "${row}" ]] || return 1
      ip="$(echo "${row}" | cut -f2)"
      phase="$(echo "${row}" | cut -f3)"
      del="$(echo "${row}" | cut -f4)"
      [[ "${phase}" == "Running" ]] || return 1
      [[ -z "${del}" ]] || return 1
      [[ -n "${ip}" ]] || return 1
    }

    mysql_ping() {
      kubectl -n "${NS}" exec "$1" -c mysql -- \
        mysqladmin --protocol=SOCKET --socket=/var/run/mysqld/mysqld.sock \
        ping -uroot -p"${PW}" --silent >/dev/null 2>&1
    }

    mysql_exec() {
      kubectl -n "${NS}" exec "$1" -c mysql -- \
        mysql --protocol=SOCKET --socket=/var/run/mysqld/mysqld.sock \
        -uroot -p"${PW}" -N -e "$2"
    }

    mysql_alive() { pod_ready "$1" && mysql_ping "$1"; }

    primary_healthy() {
      local p="$1"
      pod_running "${p}" || return 1
      mysql_ping "${p}"
    }

    mysql_tcp_probe() {
      local ip="$1"
      [[ -n "${ip}" ]] || return 1
      timeout 1 bash -c '
        ip="$0"
        exec 3<>/dev/tcp/"$ip"/3306 || exit 1
        IFS= read -r -t 0.5 -u 3 _ || exit 1
      ' "${ip}" 2>/dev/null
    }

    set_role() {
      local p="$1" want="$2" cur
      cur="$(kubectl -n "${NS}" get pod "${p}" -o jsonpath='{.metadata.labels.mysql\.role}' 2>/dev/null || true)"
      [[ "${cur}" == "${want}" ]] && return 0
      kubectl -n "${NS}" label pod "${p}" "mysql.role=${want}" --overwrite >/dev/null 2>&1 || true
    }

    ensure_root_password() {
      local pod="$1"
      if kubectl -n "${NS}" exec "${pod}" -c mysql -- \
        mysql --protocol=SOCKET --socket=/var/run/mysqld/mysqld.sock \
        -uroot -p"${PW}" -e "SELECT 1" >/dev/null 2>&1; then
        return 0
      fi
      log "warn ${pod} Secret 密码登录失败，尝试空密码并重置为 Secret"
      if kubectl -n "${NS}" exec "${pod}" -c mysql -- \
        mysql --protocol=SOCKET --socket=/var/run/mysqld/mysqld.sock \
        -uroot -e "
          SET GLOBAL super_read_only=OFF;
          SET GLOBAL read_only=OFF;
          ALTER USER 'root'@'localhost' IDENTIFIED BY '${PW}';
          CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '${PW}';
          ALTER USER 'root'@'%' IDENTIFIED BY '${PW}';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY '${PW}';
          ALTER USER 'root'@'127.0.0.1' IDENTIFIED BY '${PW}';
          GRANT ALL PRIVILEGES ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
          FLUSH PRIVILEGES;" >/dev/null 2>&1; then
        log "warn ${pod} root 密码已重置为 Secret"
        return 0
      fi
      log "error ${pod} 无法用 Secret/空密码登录 root，请删 PVC 重建: kubectl delete pvc data-${pod}"
      return 1
    }

    point_replica_to() {
      local pod="$1" src="$2"
      mysql_alive "${pod}" || return 1
      ensure_root_password "${pod}" || return 1
      if ! mysql_exec "${pod}" "
        STOP REPLICA;
        SET GLOBAL super_read_only=OFF;
        SET GLOBAL read_only=OFF;
        RESET REPLICA ALL;
        CHANGE REPLICATION SOURCE TO
          SOURCE_HOST='${src}.mysql-headless',
          SOURCE_PORT=3306,
          SOURCE_USER='repl',
          SOURCE_PASSWORD='${REPL_PW}',
          SOURCE_AUTO_POSITION=1,
          GET_SOURCE_PUBLIC_KEY=1;
        START REPLICA;
        SET GLOBAL read_only=ON;
        SET GLOBAL super_read_only=ON;"; then
        log "复制失败  ${pod} → ${src}.mysql-headless"
        return 1
      fi
      log "复制已指向  ${pod} → ${src}.mysql-headless"
      return 0
    }

    replica_io_on() {
      local st
      st="$(mysql_exec "$1" "SELECT IFNULL(SERVICE_STATE,'OFF') FROM performance_schema.replication_connection_status LIMIT 1" \
        2>/dev/null | tr -d '\r' | grep -v 'Using a password' | tail -1 || true)"
      [[ "${st}" == "ON" ]]
    }

    promote_mysql() {
      local cand="$1"
      mysql_exec "${cand}" "STOP REPLICA;" || true
      mysql_exec "${cand}" "SET GLOBAL super_read_only=OFF; SET GLOBAL read_only=OFF;"
      mysql_exec "${cand}" "
        CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED BY '${REPL_PW}';
        GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';
        FLUSH PRIVILEGES;" || true
    }

    async_align() {
      local cand="$1" p
      set_primary_pod "${cand}" || log "warn 更新 mysql-topology 失败"
      dump_pods || true
      for p in $(list_mysql); do
        [[ -n "${p}" && "${p}" != "${cand}" ]] || continue
        set_role "${p}" replica
        if mysql_alive "${p}"; then
          point_replica_to "${p}" "${cand}" || log "warn ${p} 改指向失败"
        fi
      done
      log "异步配置已更新  topology=${cand}  从库指向已对齐"
    }

    promote_to() {
      local cand="$1" old="$2" t1 ms
      [[ "${promoting}" == "0" ]] || return 0
      promoting=1
      pause_ensure
      log "故障切换  ${old:-?} → ${cand}"
      promote_mysql "${cand}" || log "warn 升主命令未确认成功，仍切换 Service 标签"
      set_role "${cand}" primary
      PRIMARY="${cand}"
      echo "${cand}" > "${PRIMARY_FILE}"
      t1="$(now_ms)"
      ms=$((t1 - down_since_ms))
      (( ms < 0 )) && ms=0
      log "切主成功  主=${cand}  故障开始→切主成功 ${ms}ms"
      down_since_ms=""
      last_status=""
      (
        async_align "${cand}" || true
        resume_ensure
      ) &
      promoting=0
    }

    pick_standby() {
      local old p
      old="$(current_pod)"
      dump_pods || true
      for p in $(list_mysql); do
        [[ -n "${p}" && "${p}" != "${old}" ]] || continue
        if pod_running "${p}" && mysql_ping "${p}"; then
          echo "${p}"
          return 0
        fi
      done
      return 1
    }

    replica_line() {
      local pod="$1" row ncfg io sql src
      if ! pod_ready "${pod}"; then echo "复制=无法查询"; return; fi
      row="$(mysql_exec "${pod}" "SELECT CONCAT_WS('|',
        IFNULL((SELECT COUNT(*) FROM performance_schema.replication_connection_configuration),0),
        IFNULL((SELECT SERVICE_STATE FROM performance_schema.replication_connection_status LIMIT 1),'none'),
        IFNULL((SELECT SERVICE_STATE FROM performance_schema.replication_applier_status LIMIT 1),'none'),
        IFNULL((SELECT HOST FROM performance_schema.replication_connection_configuration LIMIT 1),'none'))" \
        2>/dev/null | tr -d '\r' | grep -v 'Using a password' | tail -1 || true)"
      IFS='|' read -r ncfg io sql src <<<"${row}"
      if [[ "${ncfg}" == "0" || "${io}" == "none" || -z "${io}" ]]; then
        echo "复制=未配置"; return
      fi
      if [[ "${io}" == "ON" && "${sql}" == "ON" ]]; then
        echo "复制=正常 IO=${io} SQL=${sql} 源=${src}"
      else
        echo "复制=异常 IO=${io} SQL=${sql} 源=${src}"
      fi
    }

    print_roles() {
      local cur p ready rpl line
      cur="$(current_pod)"
      line="主 ${cur}"
      for p in $(list_mysql); do
        [[ -n "${p}" ]] || continue
        if pod_running "${p}"; then ready="Ready"; else ready="NotReady"; fi
        if [[ "${p}" == "${cur}" ]]; then
          line="${line} ${ready}"
        else
          rpl="$(replica_line "${p}")"
          line="${line}  |  从 ${p} ${ready} ${rpl}"
        fi
      done
      if [[ "${line}" != "${last_status}" ]]; then
        log "${line}"
        last_status="${line}"
      fi
    }

    mysql_out() { grep -v 'Using a password' | tr -d '\r' || true; }

    sync_connect_log() {
      local pri p lines line ev wm connect_watch connect_wm
      pri="$(current_pod)"
      mysql_alive "${pri}" || return 0
      mysql_exec "${pri}" "SET GLOBAL log_output='TABLE'; SET GLOBAL general_log=1;" >/dev/null 2>&1 || true
      for p in $(list_mysql); do
        [[ -n "${p}" && "${p}" != "${pri}" ]] || continue
        mysql_alive "${p}" || continue
        mysql_exec "${p}" "SET GLOBAL general_log=0;" >/dev/null 2>&1 || true
      done
      connect_watch="$(cat "${CONNECT_WATCH}" 2>/dev/null || true)"
      connect_wm="$(cat "${CONNECT_WM}" 2>/dev/null || true)"
      if [[ "${connect_watch}" != "${pri}" ]]; then
        echo "${pri}" > "${CONNECT_WATCH}"
        connect_wm="$(mysql_exec "${pri}" "SELECT DATE_FORMAT(IFNULL(MAX(event_time),NOW(6)),'%Y-%m-%d %H:%i:%s.%f') FROM mysql.general_log" 2>/dev/null | mysql_out | tail -1 || true)"
        connect_wm="$(echo "${connect_wm:-}" | tr -cd '0-9.: -')"
        [[ -n "${connect_wm}" ]] || connect_wm="1970-01-01 00:00:00.000000"
        echo "${connect_wm}" > "${CONNECT_WM}"
        log "监听客户端连接  主=${pri}"
        return 0
      fi
      wm="$(echo "${connect_wm}" | tr -cd '0-9.: -')"
      lines="$(mysql_exec "${pri}" "SELECT CONCAT_WS('|', DATE_FORMAT(event_time,'%Y-%m-%d %H:%i:%s.%f'), REPLACE(user_host,'|','/'), REPLACE(IFNULL(argument,''),'|','/')) FROM mysql.general_log WHERE command_type='Connect' AND event_time>'${wm}' AND user_host NOT LIKE '%localhost%' AND user_host NOT LIKE '%127.0.0.1%' AND user_host NOT LIKE 'repl[%' ORDER BY event_time ASC LIMIT 50" 2>/dev/null | mysql_out || true)"
      while IFS= read -r line; do
        [[ -n "${line}" ]] || continue
        [[ "${line}" == *"ERROR"* ]] && continue
        ev="${line%%|*}"
        log "客户端连接  主=${pri}  ${line#*|}"
        connect_wm="${ev}"
        echo "${connect_wm}" > "${CONNECT_WM}"
      done <<< "${lines:-}"
    }

    ensure_replicas() {
      local cur p ncfg want
      [[ -f "${PAUSE_ENSURE}" ]] && return 0
      cur="$(current_pod)"
      want="$(cat "${PRIMARY_FILE}" 2>/dev/null || echo "${cur}")"
      [[ "${cur}" == "${want}" ]] || return 0
      primary_healthy "${cur}" || return 0
      for p in $(list_mysql); do
        [[ -n "${p}" && "${p}" != "${cur}" ]] || continue
        [[ -f "${PAUSE_ENSURE}" ]] && return 0
        pod_running "${p}" || continue
        if ! ensure_root_password "${p}"; then
          log "ensure ${p} root 密码无法对齐，跳过（可 bash fix-root-password.sh ${p} 或删 PVC）"
          continue
        fi
        ncfg="$(mysql_exec "${p}" "SELECT COUNT(*) FROM performance_schema.replication_connection_configuration" 2>/dev/null | tr -d '\r' | grep -v 'Using a password' | tail -1 || true)"
        ncfg="$(echo "${ncfg:-0}" | tr -cd '0-9')"
        [[ -n "${ncfg}" ]] || ncfg=0
        if [[ "${ncfg}" == "0" ]] || ! replica_io_on "${p}"; then
          [[ -f "${PAUSE_ENSURE}" ]] && return 0
          [[ "$(cat "${PRIMARY_FILE}" 2>/dev/null)" == "${cur}" ]] || return 0
          primary_healthy "${cur}" || return 0
          log "ensure ${p} 复制未就绪 → 指向 ${cur}"
          point_replica_to "${p}" "${cur}" || log "ensure ${p} 配置失败"
        fi
      done
    }

    maybe_bg() {
      [[ -f "${PAUSE_ENSURE}" ]] && return 0
      if [[ -n "${bg_pid}" ]] && kill -0 "${bg_pid}" 2>/dev/null; then
        return 0
      fi
      (
        [[ -f "${PAUSE_ENSURE}" ]] && exit 0
        print_roles || true
        ensure_replicas || true
        sync_connect_log || true
      ) &
      bg_pid=$!
    }

    watch_pods() {
      while true; do
        dump_pods || true
        notify
        kubectl -n "${NS}" get pods -l app=mysql --watch -o name 2>/dev/null |
        while IFS= read -r _; do
          dump_pods || true
          notify
        done
        sleep 0.2
      done
    }

    tcp_probe() {
      local cur ip fails=0
      while true; do
        cur="$(cat "${PRIMARY_FILE}" 2>/dev/null || true)"
        ip="$(pod_ip "${cur}")"
        if [[ -z "${cur}" || -z "${ip}" ]]; then
          fails=0
          sleep 0.1
          continue
        fi
        if mysql_tcp_probe "${ip}"; then
          fails=0
        else
          fails=$((fails + 1))
          if (( fails >= 2 )); then
            log "TCP 探测失败  ${cur} ${ip}"
            dump_pods || true
            notify
            fails=0
          fi
        fi
        sleep "${INTERVAL}"
      done
    }

    check_failover() {
      local cur now cand fail_ms
      cur="$(current_pod)"
      if primary_healthy "${cur}"; then
        down_since_ms=""
        resume_ensure
        maybe_bg
        return 0
      fi
      now="$(now_ms)"
      if [[ -z "${down_since_ms}" ]]; then
        down_since_ms="${now}"
        last_status=""
        pause_ensure
        log "主库不可用  ${cur}  故障开始"
      fi
      fail_ms=$((FAIL_AFTER * 1000))
      if (( now - down_since_ms < fail_ms )); then
        log "等待升主  $((now - down_since_ms))/${fail_ms}ms"
        return 0
      fi
      cand="$(pick_standby || true)"
      if [[ -n "${cand}" ]]; then
        log "主库不可用，升主 ${cand}"
        promote_to "${cand}" "${cur}" || true
      else
        log "无可用从库可升主"
      fi
    }

    trap 'kill $(jobs -p) 2>/dev/null || true' EXIT

    load_primary
    resume_ensure
    dump_pods || true
    watch_pods &
    tcp_probe &

    log "启动  ns=${NS}  fail_after=${FAIL_AFTER}s  interval=${INTERVAL}s  主=${PRIMARY}  策略=Watch+TCP探测即时升主，配置异步对齐"
    while true; do
      check_failover || true
      read -t "${INTERVAL}" -r -u 6 _ || true
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-controller
  template:
    metadata:
      labels:
        app: mysql-controller
    spec:
      serviceAccountName: mysql-controller
      containers:
        - name: controller
          image: registry.cn-global.starbucket.com.cn/starbucket/docker.io/alpine/k8s:1.33.1
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/run.sh"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FAIL_AFTER
              value: "0"
            - name: INTERVAL
              value: "0.15"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: root-password
                  optional: true
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-auth
                  key: replication-password
                  optional: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: mysql-controller
            defaultMode: 0755
