---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-postgres
  namespace: nexus
type: Opaque
stringData:
  POSTGRES_DB: nexus
  POSTGRES_USER: nexus
  POSTGRES_PASSWORD: KK8[)x5m#Q:Ho3Ux5V%^0aFP

---
# 仅在 Postgres 数据目录为空时执行一次（对应 compose 的 docker-entrypoint-initdb.d）
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: nexus
data:
  01-init-nexus.sql: |
    CREATE SCHEMA IF NOT EXISTS nexus;
    GRANT ALL ON SCHEMA nexus TO nexus;
    ALTER ROLE nexus SET search_path TO nexus, public;

---
apiVersion: v1
kind: Service
metadata:
  name: nexus-service
  namespace: nexus
spec:
  type: ClusterIP
  selector:
    app: nexus
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexus
  namespace: nexus
spec:
  serviceName: nexus
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        fsGroup: 200
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: nexus
          image: registry.cn-global.starbucket.com.cn/starbucket/docker.io/sonatype/nexus3:3.94.1
          imagePullPolicy: IfNotPresent
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: >-
                -Xms3g -Xmx6g -XX:MaxDirectMemorySize=3g
                -Djava.util.prefs.userRoot=/nexus-data/javaprefs
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests:
              cpu: "1"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 12Gi
          startupProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /nexus-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-nexus-data
