apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: dev
data:
  sentinel.conf.tpl: |
    port 26379
    dir /data
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor mymaster redis-0.redis.dev.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    sentinel parallel-syncs mymaster 1
    sentinel auth-pass mymaster __REDIS_PASSWORD__
    requirepass __REDIS_PASSWORD__

  start.sh: |
    #!/bin/sh
    set -e
    export REDISCLI_AUTH="$REDIS_PASSWORD"

    ESCAPED_PW=$(printf '%s' "$REDIS_PASSWORD" | sed -e 's/[\\&]/\\&/g')
    sed "s|__REDIS_PASSWORD__|${ESCAPED_PW}|g" \
      /etc/sentinel-template/sentinel.conf.tpl > /etc/sentinel/sentinel.conf
    chmod 600 /etc/sentinel/sentinel.conf

    exec redis-sentinel /etc/sentinel/sentinel.conf