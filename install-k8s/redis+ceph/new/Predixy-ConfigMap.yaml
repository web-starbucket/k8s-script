apiVersion: v1
kind: ConfigMap
metadata:
  name: predixy-config
  namespace: dev
data:
  predixy.conf: |
    Name Predixy-Default
    Bind 0.0.0.0:7617
    WorkerThreads 4
    Log /dev/stdout

    Authority {
      Auth "%<@K0TKUo0K1oP&QZ;JvZLb[" {
        Mode admin
      }
    }

    SentinelServerPool {
      Password "%<@K0TKUo0K1oP&QZ;JvZLb["
      Databases 16
      Hash crc16
      HashTag "{}"
      Distribution modula
      MasterReadPriority 60
      StaticSlaveReadPriority 0
      DynamicSlaveReadPriority 0
      RefreshInterval 1
      ServerTimeout 1
      ServerFailureLimit 10
      ServerRetryTimeout 1
      KeepAlive 120
      Sentinels "%<@K0TKUo0K1oP&QZ;JvZLb[" {
        + sentinel.dev.svc.cluster.local:26379
      }
      Group mymaster {
      }
    }