apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dev
spec:
  clusterIP: None
  ports:
    - port: 6379
      name: redis
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel
  namespace: dev
spec:
  clusterIP: None
  ports:
    - port: 26379
      name: sentinel
  selector:
    app: sentinel