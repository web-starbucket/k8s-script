# 需 Gateway default/eg 已存在；按实际域名改 hostnames
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexus
  namespace: default
spec:
  parentRefs:
    - name: eg
      namespace: default
  hostnames:
    - nexus.obsbot.lan
  rules:
    - backendRefs:
        - name: nexus
          port: 8081
