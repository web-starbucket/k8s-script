# =============================================================================
# 监控一体配置（Prometheus + Grafana + Alertmanager + Loki + Alloy + Tempo）
# 使用：bash install.sh
# =============================================================================

# ----- 存储后端 -----
# type: nfs       静态 PV，需先在 NFS 服务器建目录并授权（见 README 3.2）
#       ceph-rbd  动态供给（推荐）；需先装 install-ceph 的 CSI，StorageClass 默认 ceph-rbd
#                 注意：ceph-rbd 的 reclaimPolicy=Delete，destroy/reinstall 会连数据一起删
# size: 可选；设置后统一覆盖 5 个组件的 PVC 容量（RBD 精简供给，不占满不算空间）
storage:
  type: ceph-rbd
  storageClass: ceph-rbd
  size: 50Gi

# type=nfs 时生效
nfs:
  server: 172.16.10.129
  basePath: /data/nfs/shared/monitoring

# ----- kube-prometheus-stack -----
kubePrometheus:
  fullnameOverride: monitoring
  defaultRules:
    create: true
  grafana:
    enabled: true
    adminUser: admin
    adminPassword: admin123456
    image:
      registry: registry.cn-global.starbucket.com.cn/starbucket
      repository: docker.io/grafana/grafana
      tag: "11.5.2"
      pullPolicy: IfNotPresent
    grafana.ini:
      users:
        default_language: zh-Hans
    sidecar:
      image:
        registry: registry.cn-global.starbucket.com.cn/starbucket
        repository: quay.io/kiwigrid/k8s-sidecar
        tag: "1.28.0"
      datasources:
        enabled: true
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        jsonData:
          maxLines: 1000
          timeout: 60
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki
    initChownData:
      enabled: false
      image:
        registry: registry.cn-global.starbucket.com.cn/starbucket
        repository: docker.io/library/busybox
        tag: "1.36.1"
    service:
      type: NodePort
      nodePort: 30300
    persistence:
      enabled: true
      type: pvc
      existingClaim: data-grafana
    # RWO 卷（ceph-rbd）与滚动更新冲突（Multi-Attach），必须 Recreate：先杀旧 Pod 再起新的
    deploymentStrategy:
      type: Recreate
  alertmanager:
    enabled: true
    service:
      type: NodePort
      nodePort: 30303
    alertmanagerSpec:
      replicas: 1
      # 放开全 namespace：业务分区可在自己 ns 建 AlertmanagerConfig 自定义告警路由
      alertmanagerConfigSelector: {}
      alertmanagerConfigNamespaceSelector: {}
      image:
        registry: registry.cn-global.starbucket.com.cn/starbucket
        repository: quay.io/prometheus/alertmanager
        tag: "v0.27.0"
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: ""
            volumeName: pv-mon-alertmanager
            accessModes: ["ReadWriteMany"]
            resources:
              requests:
                storage: 5Gi
  prometheus:
    enabled: true
    service:
      type: NodePort
      nodePort: 30390
    prometheusSpec:
      replicas: 1
      retention: 15d
      scrapeInterval: 30s
      evaluationInterval: 30s
      # —— 监控所有 namespace（新业务分区 dev/test/prod 无需改这里）——
      # chart 默认只采集带本 release 标签的 CR；关掉 helm 标签限制 + 空选择器
      # = 任意 namespace 的 ServiceMonitor/PodMonitor/ScrapeConfig/PrometheusRule 自动生效
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}    # {} = 所有 namespace
      podMonitorNamespaceSelector: {}
      probeNamespaceSelector: {}
      scrapeConfigNamespaceSelector: {}
      ruleNamespaceSelector: {}
      image:
        registry: registry.cn-global.starbucket.com.cn/starbucket
        repository: quay.io/prometheus/prometheus
        tag: "v2.54.1"
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: ""
            volumeName: pv-mon-prometheus
            accessModes: ["ReadWriteMany"]
            resources:
              requests:
                storage: 50Gi
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
  prometheusOperator:
    enabled: true
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    tls:
      enabled: false
    image:
      registry: registry.cn-global.starbucket.com.cn/starbucket
      repository: quay.io/prometheus-operator/prometheus-operator
      tag: "v0.77.2"
    prometheusConfigReloader:
      image:
        registry: registry.cn-global.starbucket.com.cn/starbucket
        repository: quay.io/prometheus-operator/prometheus-config-reloader
        tag: "v0.77.2"
  kube-state-metrics:
    enabled: true
    image:
      registry: registry.cn-global.starbucket.com.cn/starbucket
      repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
      tag: "v2.13.0"
    kubeRBACProxy:
      image:
        registry: registry.cn-global.starbucket.com.cn/starbucket
        repository: quay.io/brancz/kube-rbac-proxy
        tag: v0.18.1
  prometheus-node-exporter:
    enabled: true
    image:
      registry: registry.cn-global.starbucket.com.cn/starbucket
      repository: docker.io/prom/node-exporter
      # 必须写死；chart 默认是 v1.8.2-distroless
      tag: "v1.8.2"
      digest: ""
      pullPolicy: IfNotPresent
    kubeRBACProxy:
      image:
        registry: registry.cn-global.starbucket.com.cn/starbucket
        repository: quay.io/brancz/kube-rbac-proxy
        tag: v0.18.1
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: true
  kubelet:
    enabled: true
  coreDns:
    enabled: true
  kubeApiServer:
    enabled: true

# ----- Loki -----
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
    # 日志保留 3 个月，到期由 Compactor 自动删除
    limits_config:
      retention_period: 2160h   # 90d = 3 个月
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
    image:
      registry: registry.cn-global.starbucket.com.cn/starbucket
      repository: docker.io/grafana/loki
      tag: "3.3.2"
  singleBinary:
    replicas: 1
    # StatefulSet PVC 名固定为 storage-loki-0（install.sh 预建并绑 pv-mon-loki）
    persistence:
      enabled: true
      size: 50Gi
      storageClass: ""
      enableStatefulSetAutoDeletePVC: false
      whenDeleted: Retain
      whenScaled: Retain
      # 部分 chart 版本支持；与预建 PVC / NFS PV 保持一致
      accessModes:
        - ReadWriteMany
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
  # 关闭规则 sidecar（避免再拉 k8s-sidecar）
  sidecar:
    image:
      repository: registry.cn-global.starbucket.com.cn/starbucket/quay.io/kiwigrid/k8s-sidecar
    rules:
      enabled: false
  read:
    replicas: 0
    persistence:
      enabled: false
  write:
    replicas: 0
    persistence:
      enabled: false
      volumeClaimsEnabled: false
  backend:
    replicas: 0
    persistence:
      enabled: false
      volumeClaimsEnabled: false
  gateway:
    enabled: true
    image:
      registry: registry.cn-global.starbucket.com.cn/starbucket
      repository: docker.io/nginxinc/nginx-unprivileged
      tag: "1.27.2-alpine"
    service:
      type: ClusterIP
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  test:
    enabled: false
  lokiCanary:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false
    rules:
      enabled: false

# ----- Tempo（单实例，grafana/tempo chart；Service 名 tempo，查询口 3200，OTLP gRPC 4317）-----
tempo:
  replicas: 1
  tempo:
    registry: registry.cn-global.starbucket.com.cn/starbucket
    repository: docker.io/grafana/tempo
    tag: "2.9.0"
    pullPolicy: IfNotPresent
    reportingEnabled: false
    retention: 720h   # 30d
    # liveness 用 TCP 探端口（HTTP /metrics 会让 kubelet 每次探活在 Tempo 日志里刷 broken pipe 噪音）；
    # /ready 未就绪会 503，不要拿它做 liveness，避免探针把 Pod 杀掉。
    # 注意：chart 默认带 httpGet，helm values 深合并，必须显式 httpGet: null 抹掉，否则两个 handler 并存报错
    livenessProbe:
      httpGet: null
      tcpSocket:
        port: 3200
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      httpGet:
        path: /ready
        port: 3200
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 12
      successThreshold: 1
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
  tempoQuery:
    enabled: false
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false
    accessModes:
      - ReadWriteMany
    size: 20Gi
    storageClassName: ""
  serviceMonitor:
    enabled: false

# ----- Alloy（日志采集，替代 Promtail——Promtail 2026-03 EOL；helm grafana/alloy）-----
# 镜像走 starbucket（alloy v1.21.3 已同步）；如 starbucket 缺新版本会 ImagePullBackOff，
# 兜底可临时改 docker.m.daocloud.io + repository 去掉 docker.io/ 前缀
alloy:
  image:
    registry: registry.cn-global.starbucket.com.cn/starbucket
    repository: docker.io/grafana/alloy
    tag: "v1.21.3"        # starbucket 现有版本；升级前先探测 starbucket 有没有新 tag
    pullPolicy: IfNotPresent
  configReloader:
    image:
      # 新版 alloy chart 的 reloader 是 prometheus-config-reloader（--watched-dir 参数风格），
      # 不能用 jimmidyson/configmap-reload（--volume-dir 风格），参数不兼容会 CrashLoop
      registry: registry.cn-global.starbucket.com.cn/starbucket
      repository: quay.io/prometheus-operator/prometheus-config-reloader
      tag: "v0.77.2"      # starbucket 有此版；chart 默认 v0.94.2 未同步，推上去后可换
      digest: ""
      pullPolicy: IfNotPresent
  controller:
    type: daemonset
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 512m
      memory: 512Mi
  alloy:
    mounts:
      varlog: true          # 挂 /var/log，loki.source.file 读容器日志文件
    configMap:
      content: |
        // 采集 /var/log/pods 下容器日志 → cri 解析 → loki-gateway（等价原 Promtail）
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.cri.receiver]
        }

        loki.process "cri" {
          stage.cri {}
          forward_to = [loki.write.loki.receiver]
        }

        loki.write "loki" {
          endpoint {
            url       = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            tenant_id = "fake"
          }
        }
