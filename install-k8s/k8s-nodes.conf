K8S_MINOR=1.33

# 镜像加速前缀（国内；不要带 https:// 前缀；留空则用官方 registry.k8s.io / docker.io / quay.io）
# 设置后所有镜像重写为绝对地址，例如:
#   docker.io/calico/apiserver:v3.29.3
#   → registry.cn-global.starbucket.com.cn/starbucket/docker.io/calico/apiserver:v3.29.3
# 集群已装 Calico 后修改此项，在 Master-1 执行原地切换（无需重装）:
#   sudo bash install-k8s.sh cni-calico-mirror
IMAGE_MIRROR=registry.cn-global.starbucket.com.cn/starbucket

