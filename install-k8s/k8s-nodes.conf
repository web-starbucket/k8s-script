# Kubernetes 节点规划（含 SSH 账号，install-k8s.sh 自动读取）
#
# ---- 安装版本 ----
# 脚本支持范围固定为 1.30~1.33；超出请自行安装。
# 不填 K8S_MINOR 则默认安装 1.33。
# 环境变量 K8S_MINOR / KUBE_VERSION 可临时覆盖。
K8S_MINOR=1.33
# 可选：钉死完整 apt 包版本，例如 1.33.1-1.1（留空则装该次要版本仓库内最新）
# KUBE_VERSION=

# ---- 镜像源（可选，留空用官方）----
# IMAGE_MIRROR=registry.cn-global.starbucket.com.cn/starbucket

# ---- 节点表 ----
# 格式: IP|主机名|角色|用户名|密码
# 角色: vip | master | worker
# vip 行用户/密码可留空；master/worker 必须填，供 ssh-keys 非交互互换密钥
# 密码不要包含字符 |
# 权限建议: chmod 600 k8s-nodes.conf
#
# 改完后:
#   sudo bash install-k8s.sh hosts
#   sudo bash install-k8s.sh ssh-keys
#   sudo bash install-k8s.sh vip-all

172.16.10.100|k8s-vip|vip||
172.16.10.114|k8s-m1|master|root|请改成真实密码
172.16.10.115|k8s-m2|master|root|请改成真实密码
172.16.10.116|k8s-m3|master|root|请改成真实密码
172.16.10.117|k8s-n1|worker|root|请改成真实密码
