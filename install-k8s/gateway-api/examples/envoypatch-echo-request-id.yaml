# 响应头回写 x-request-id + x-trace-id
#
# 注意：HCM 上不能 patch response_headers_to_add
# （EG 反序列化会报 unknown field "response_headers_to_add" → Programmed=False）
# 应追加到已有的 envoy.filters.http.header_mutation（你们已用它改 Server）
#
# 前提：
#   extensionApis.enableEnvoyPatchPolicy: true
#   EnvoyProxy tracing → Tempo（已开）
#   数据面 Envoy >= 1.36（%TRACE_ID% 在 header mutation 里才可用）
#
# listener: <ns>/<gateway>/<listener>
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: echo-request-id
  namespace: default
spec:
  type: JSONPatch
  priority: 100
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: default/eg/http
      operation:
        op: add
        path: /default_filter_chain/filters/0/typed_config/always_set_request_id_in_response
        value: true
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: default/eg/http
      operation:
        op: add
        path: /default_filter_chain/filters/0/typed_config/generate_request_id
        value: true
    # http_filters[1] = header_mutation（[0]=custom_response）。若顺序变了，describe 失败后再改下标
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: default/eg/http
      operation:
        op: add
        path: /default_filter_chain/filters/0/typed_config/http_filters/1/typed_config/mutations/response_mutations/-
        value:
          append:
            header:
              key: x-trace-id
              value: "%TRACE_ID%"
            append_action: OVERWRITE_IF_EXISTS_OR_ADD
