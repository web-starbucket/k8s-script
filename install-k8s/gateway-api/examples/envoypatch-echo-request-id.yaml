# x-request-id + x-trace-id
#
# header_mutation 下标（改完必须 delete + apply 本 Policy）：
#   - 无 BTP / 无 custom_response → http_filters/0
#   - 有 BTP.responseOverride（Accepted）→ http_filters/1
# Programmed 报 unknown field "mutations" = 下标打到了 grpc_web，改另一档
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: echo-request-id
  namespace: default
spec:
  type: JSONPatch
  priority: 100
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: default/eg/http
      operation:
        op: add
        path: /default_filter_chain/filters/0/typed_config/always_set_request_id_in_response
        value: true
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: default/eg/http
      operation:
        op: add
        path: /default_filter_chain/filters/0/typed_config/generate_request_id
        value: true
    # 先按无 custom_response（下标 0）恢复 x-trace-id；BTP Accepted 后再改成 /1
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: default/eg/http
      operation:
        op: add
        path: /default_filter_chain/filters/0/typed_config/http_filters/0/typed_config/mutations/response_mutations/-
        value:
          append:
            header:
              key: x-trace-id
              value: "%TRACE_ID%"
            append_action: OVERWRITE_IF_EXISTS_OR_ADD
