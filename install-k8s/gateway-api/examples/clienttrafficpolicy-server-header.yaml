# 全局改写响应头 Server → Gateway（挂到 Gateway eg）
# 先试这个；若 curl 仍看到 nginx，再用同目录 envoypatch-server-header.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: set-server-header
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  # HTTP/3（QUIC）：需 Gateway 已有 HTTPS 443；数据面 Service 会出现 UDP/443
  http3: {}
  headers:
    lateResponseHeaders:
      set:
        - name: Server
          value: Gateway
