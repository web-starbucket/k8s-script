# 未匹配到任何业务路由时返回自定义 HTML 404
# 需挂在「PathPrefix: /、无 backend」的兜底 HTTPRoute 上（见文件末尾注释）
# HTML/CSS 不要出现 % 字符
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: route-not-found
  namespace: default
spec:
  directResponse:
    statusCode: 404
    contentType: text/html; charset=utf-8
    body:
      type: Inline
      inline: |
        <!DOCTYPE html>
        <html lang="zh-CN">
        <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width, initial-scale=1"/>
          <title>OpS</title>
          <style>
            * { box-sizing: border-box; }
            body {
              margin: 0;
              min-height: 100vh;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              font-family: "Söhne", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
              color: #e8f4ef;
              overflow: hidden;
              background:
                radial-gradient(ellipse 900px 620px at 12vw -8vh, rgba(45, 212, 191, 0.22), transparent 70vw),
                radial-gradient(ellipse 760px 540px at 92vw 108vh, rgba(56, 189, 248, 0.16), transparent 68vw),
                radial-gradient(ellipse 520px 420px at 70vw 18vh, rgba(110, 231, 183, 0.1), transparent 55vw),
                linear-gradient(165deg, #07131a 0px, #0c2430 42vw, #0a1c26 100vw);
            }
            .mesh {
              position: fixed;
              inset: 0;
              z-index: 0;
              pointer-events: none;
              background-image:
                linear-gradient(rgba(148, 210, 190, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 210, 190, 0.045) 1px, transparent 1px);
              background-size: 48px 48px;
              mask-image: radial-gradient(ellipse 720px 520px at center, #000 20vw, transparent 78vw);
              -webkit-mask-image: radial-gradient(ellipse 720px 520px at center, #000 20vw, transparent 78vw);
            }
            .orb {
              position: fixed;
              border-radius: 9999px;
              filter: blur(72px);
              pointer-events: none;
              z-index: 0;
            }
            .orb-a {
              width: 460px; height: 460px;
              top: -160px; right: -100px;
              background: #1f6f6a;
              opacity: 0.55;
              animation: drift 9s ease-in-out infinite alternate;
            }
            .orb-b {
              width: 420px; height: 420px;
              bottom: -180px; left: -120px;
              background: #1a4f78;
              opacity: 0.48;
              animation: drift 11s ease-in-out infinite alternate-reverse;
            }
            .orb-c {
              width: 280px; height: 280px;
              top: 38vh; left: 42vw;
              background: #2a8f7a;
              opacity: 0.22;
              filter: blur(90px);
            }
            .card {
              position: relative;
              z-index: 1;
              width: 460px;
              max-width: 92vw;
              padding: 48px 40px 36px;
              background: rgba(10, 28, 36, 0.72);
              border: 1px solid rgba(126, 220, 196, 0.16);
              border-radius: 28px;
              text-align: center;
              box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 1px 0 rgba(167, 243, 208, 0.08) inset;
              backdrop-filter: blur(18px);
              -webkit-backdrop-filter: blur(18px);
              animation: rise 0.65s ease-out both;
            }
            .card::before {
              content: "";
              position: absolute;
              top: 0; left: 36px; right: 36px;
              height: 1px;
              background: linear-gradient(90deg, transparent, rgba(94, 234, 212, 0.55), transparent);
            }
            .icon {
              position: relative;
              width: 92px; height: 92px;
              margin: 4px auto 30px;
              display: grid;
              place-items: center;
            }
            .icon-glow {
              position: absolute;
              width: 56px; height: 56px;
              border-radius: 9999px;
              background: #2dd4bf;
              opacity: 0.18;
              filter: blur(14px);
              animation: glow 1.8s ease-in-out infinite alternate;
            }
            .icon svg { overflow: visible; }
            .search-ring {
              transform-origin: 44px 44px;
              animation: ring-spin 3s linear infinite;
            }
            .search-lens {
              transform-origin: 40px 40px;
              animation: lens-pulse 1.4s ease-in-out infinite alternate;
            }
            .search-handle {
              transform-origin: 50px 50px;
              animation: handle-swing 1.4s ease-in-out infinite alternate;
            }
            .search-arc {
              transform-origin: 40px 40px;
              animation: arc-spin 1.1s linear infinite;
            }
            .badge {
              display: inline-block;
              margin-bottom: 14px;
              padding: 5px 12px;
              border-radius: 9999px;
              background: rgba(45, 212, 191, 0.12);
              border: 1px solid rgba(94, 234, 212, 0.22);
              color: #5eead4;
              font-size: 11px;
              font-weight: 700;
              letter-spacing: 0.16em;
            }
            h1 {
              margin: 0 0 12px;
              font-size: 42px;
              font-weight: 700;
              letter-spacing: 0.08em;
              line-height: 1.05;
              background: linear-gradient(120deg, #f0fdfa 0px, #5eead4 48vw, #7dd3fc 100vw);
              -webkit-background-clip: text;
              background-clip: text;
              color: transparent;
              -webkit-text-fill-color: transparent;
            }
            p {
              margin: 0 auto;
              max-width: 340px;
              color: #9db5ae;
              font-size: 15px;
              line-height: 1.75;
              letter-spacing: 0.01em;
            }
            .hint {
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              margin-top: 28px;
              padding-top: 18px;
              border-top: 1px solid rgba(148, 210, 190, 0.1);
              font-size: 12px;
              color: #6f8b83;
              letter-spacing: 0.14em;
            }
            .hint i {
              width: 6px; height: 6px;
              border-radius: 9999px;
              background: #2dd4bf;
              box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.16);
              animation: glow 1.6s ease-in-out infinite alternate;
            }
            @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
            @keyframes glow { from { opacity: 0.1; transform: scale(0.92); } to { opacity: 0.28; transform: scale(1.08); } }
            @keyframes lens-pulse { from { transform: scale(0.94); } to { transform: scale(1.06); } }
            @keyframes handle-swing { from { transform: rotate(-10deg); } to { transform: rotate(6deg); } }
            @keyframes ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            @keyframes arc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-24px, 18px); } }
          </style>
        </head>
        <body>
          <div class="mesh" aria-hidden="true"></div>
          <div class="orb orb-a"></div>
          <div class="orb orb-b"></div>
          <div class="orb orb-c"></div>
          <main class="card">
            <div class="icon" aria-hidden="true">
              <div class="icon-glow"></div>
              <svg xmlns="http://www.w3.org/2000/svg" width="88" height="88" viewBox="0 0 88 88">
                <circle class="search-ring" cx="44" cy="44" r="30" fill="none" stroke="rgba(94,234,212,0.12)" stroke-width="5"/>
                <circle class="search-lens" cx="40" cy="40" r="14" fill="none" stroke="#2dd4bf" stroke-width="5"/>
                <path class="search-arc" d="M40 26 a14 14 0 0 1 14 14" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
                <path class="search-handle" d="M50 50 L62 62" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="badge">HTTP 404</div>
            <h1>OpS</h1>
            <p>没有匹配到可用路由，请检查访问地址。</p>
            <div class="hint"><i></i> GATEWAY</div>
          </main>
        </body>
        </html>
# ---
# 兜底 HTTPRoute 示例（单独 apply；不要和业务 /website 写在同一条更具体规则之后抢流量）
# apiVersion: gateway.networking.k8s.io/v1
# kind: HTTPRoute
# metadata:
#   name: http-eg-not-found
#   namespace: default
# spec:
#   parentRefs:
#     - name: eg
#       namespace: default
#   rules:
#     - matches:
#         - path:
#             type: PathPrefix
#             value: /
#       filters:
#         - type: ExtensionRef
#           extensionRef:
#             group: gateway.envoyproxy.io
#             kind: HTTPRouteFilter
#             name: route-not-found
