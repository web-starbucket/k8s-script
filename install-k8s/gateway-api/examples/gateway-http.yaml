# HTTP 80 + HTTPS 443（443 需要同命名空间 TLS Secret default/eg-tls）
# 没有证书时先注释掉 https listener，只开 80
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
