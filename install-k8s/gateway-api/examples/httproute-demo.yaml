# 示例：HTTP 业务挂到 Gateway eg
# 访问: http://<节点IP>:<Gateway-NodePort>/app/
# 或带 Host: demo.example.com
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-http
  namespace: default
spec:
  parentRefs:
    - name: eg
      namespace: default
      # sectionName: http   # 对应 Gateway listeners[].name，多 listener 时建议写上
  hostnames:
    - "demo.example.com"   # 可选；不写则匹配任意 Host
  rules:
    # 按路径转发
    - matches:
        - path:
            type: PathPrefix
            value: /app
      backendRefs:
        - name: demo-svc      # 同命名空间 Service
          port: 8080
    # 按精确路径 + Header（可选）
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: demo-svc
          port: 8080
