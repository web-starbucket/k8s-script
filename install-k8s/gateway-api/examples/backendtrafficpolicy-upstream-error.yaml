# Envoy 把 response body 当格式串：HTML/CSS 里不能出现任何 % 字符
# 禁止：width:50%、border-radius:50%、keyframes 0%/100%
# 圆角用 px；动画用 from/to
apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-error-body
  namespace: default
data:
  response.body: |
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <title>OpS</title>
      <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,"/>
      <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          font-family: "Söhne", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
          color: #e8f4ef;
          overflow: hidden;
          background:
            radial-gradient(ellipse 900px 620px at 12vw -8vh, rgba(45, 212, 191, 0.22), transparent 70vw),
            radial-gradient(ellipse 760px 540px at 92vw 108vh, rgba(56, 189, 248, 0.16), transparent 68vw),
            radial-gradient(ellipse 520px 420px at 70vw 18vh, rgba(110, 231, 183, 0.1), transparent 55vw),
            linear-gradient(165deg, #07131a 0px, #0c2430 42vw, #0a1c26 100vw);
        }
        .mesh {
          position: fixed;
          inset: 0;
          z-index: 0;
          pointer-events: none;
          background-image:
            linear-gradient(rgba(148, 210, 190, 0.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(148, 210, 190, 0.045) 1px, transparent 1px);
          background-size: 48px 48px;
          mask-image: radial-gradient(ellipse 720px 520px at center, #000 20vw, transparent 78vw);
          -webkit-mask-image: radial-gradient(ellipse 720px 520px at center, #000 20vw, transparent 78vw);
        }
        .orb {
          position: fixed;
          border-radius: 9999px;
          filter: blur(72px);
          pointer-events: none;
          z-index: 0;
        }
        .orb-a {
          width: 460px; height: 460px;
          top: -160px; right: -100px;
          background: #1f6f6a;
          opacity: 0.55;
          animation: drift 9s ease-in-out infinite alternate;
        }
        .orb-b {
          width: 420px; height: 420px;
          bottom: -180px; left: -120px;
          background: #1a4f78;
          opacity: 0.48;
          animation: drift 11s ease-in-out infinite alternate-reverse;
        }
        .orb-c {
          width: 280px; height: 280px;
          top: 38vh; left: 42vw;
          background: #2a8f7a;
          opacity: 0.22;
          filter: blur(90px);
        }
        .card {
          position: relative;
          z-index: 1;
          width: 460px;
          max-width: 92vw;
          padding: 48px 40px 36px;
          background: rgba(10, 28, 36, 0.72);
          border: 1px solid rgba(126, 220, 196, 0.16);
          border-radius: 28px;
          text-align: center;
          box-shadow:
            0 30px 80px rgba(0, 0, 0, 0.35),
            0 0 0 1px rgba(255, 255, 255, 0.03) inset,
            0 1px 0 rgba(167, 243, 208, 0.08) inset;
          backdrop-filter: blur(18px);
          -webkit-backdrop-filter: blur(18px);
          animation: rise 0.65s ease-out both;
        }
        .card::before {
          content: "";
          position: absolute;
          top: 0; left: 36px; right: 36px;
          height: 1px;
          background: linear-gradient(90deg, transparent, rgba(94, 234, 212, 0.55), transparent);
        }
        .stage {
          position: relative;
          width: 92px; height: 92px;
          margin: 4px auto 30px;
        }
        .glow {
          position: absolute;
          inset: 10px;
          border-radius: 9999px;
          background: #2dd4bf;
          opacity: 0.18;
          filter: blur(14px);
          animation: pulse 1.8s ease-in-out infinite alternate;
        }
        .ring {
          position: relative;
          width: 92px; height: 92px;
          animation: spin 1.05s linear infinite;
        }
        .dots { display: flex; justify-content: center; gap: 8px; margin: 20px 0 0; }
        .dots span {
          width: 6px; height: 6px;
          border-radius: 9999px;
          background: #5eead4;
          animation: blink 1.2s ease-in-out infinite alternate;
        }
        .dots span:nth-child(2) { animation-delay: 0.16s; }
        .dots span:nth-child(3) { animation-delay: 0.32s; }
        .badge {
          display: inline-block;
          margin-bottom: 14px;
          padding: 5px 12px;
          border-radius: 9999px;
          background: rgba(45, 212, 191, 0.12);
          border: 1px solid rgba(94, 234, 212, 0.22);
          color: #5eead4;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.16em;
        }
        h1 {
          margin: 0 0 12px;
          font-size: 42px;
          font-weight: 700;
          letter-spacing: 0.08em;
          line-height: 1.05;
          background: linear-gradient(120deg, #f0fdfa 0px, #5eead4 48vw, #7dd3fc 100vw);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }
        p {
          margin: 0 auto;
          max-width: 340px;
          color: #9db5ae;
          font-size: 15px;
          line-height: 1.75;
          letter-spacing: 0.01em;
        }
        .hint {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          margin-top: 28px;
          padding-top: 18px;
          border-top: 1px solid rgba(148, 210, 190, 0.1);
          font-size: 12px;
          color: #6f8b83;
          letter-spacing: 0.14em;
        }
        .hint i {
          width: 6px; height: 6px;
          border-radius: 9999px;
          background: #2dd4bf;
          box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.16);
          animation: pulse 1.6s ease-in-out infinite alternate;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { from { opacity: 0.1; transform: scale(0.92); } to { opacity: 0.28; transform: scale(1.08); } }
        @keyframes blink { from { opacity: 0.28; transform: translateY(2px); } to { opacity: 1; transform: translateY(-2px); } }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-24px, 18px); } }
      </style>
    </head>
    <body>
      <div class="mesh" aria-hidden="true"></div>
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <main class="card">
        <div class="stage" aria-hidden="true">
          <div class="glow"></div>
          <svg class="ring" viewBox="0 0 92 92">
            <circle cx="46" cy="46" r="31" fill="none" stroke="rgba(94,234,212,0.12)" stroke-width="5"/>
            <path d="M46 15 a31 31 0 0 1 31 31" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round"/>
            <path d="M46 77 a31 31 0 0 1 -14 -4" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
            <circle cx="46" cy="46" r="7" fill="#2dd4bf"/>
          </svg>
        </div>
        <div class="badge">HTTP 503</div>
        <h1>OpS</h1>
        <p>服务暂时不可用，网关正在等待故障恢复。<br/>感谢您的耐心等待！</p>
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="hint"><i></i> GATEWAY</div>
      </main>
    </body>
    </html>
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: upstream-error
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 500
          - type: Value
            value: 502
          - type: Value
            value: 503
      source: Local
      response:
        contentType: text/html; charset=utf-8
        statusCode: 503
        body:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: upstream-error-body
