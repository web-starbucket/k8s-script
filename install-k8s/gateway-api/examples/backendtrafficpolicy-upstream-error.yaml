# Envoy 把 response body 当格式串：HTML/CSS 里不能出现任何 % 字符
# 禁止：width:50%、border-radius:50%、keyframes 0%/100%
# 圆角用 px；动画用 from/to
apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-error-body
  namespace: default
data:
  response.body: |
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <title>服务加载中</title>
      <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,"/>
      <style>
        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
          background: #f4f6f8;
          color: #1a1d21;
        }
        .card {
          width: 420px;
          max-width: 92vw;
          padding: 40px 32px;
          background: #fff;
          border: 1px solid #e6e9ee;
          border-radius: 16px;
          text-align: center;
          box-shadow: 0 10px 30px rgba(26, 29, 33, 0.06);
        }
        .spinner {
          box-sizing: border-box;
          width: 48px;
          height: 48px;
          margin: 0 auto 24px;
          border: 4px solid #e3e8ef;
          border-top-color: #0078d4;
          border-right-color: #4da3ff;
          border-radius: 9999px;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { margin: 0; color: #5b6570; font-size: 15px; line-height: 1.6; }
        .hint { margin-top: 22px; font-size: 13px; color: #8a949e; }
      </style>
    </head>
    <body>
      <main class="card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>服务加载中，请稍候...</h1>
        <p>后端服务暂时不可用，系统正在努力恢复。<br/>感谢您的耐心等待。</p>
        <div class="hint">Gateway</div>
      </main>
    </body>
    </html>
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: upstream-error
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 500
          - type: Value
            value: 502
          - type: Value
            value: 503
      source: Local
      response:
        contentType: text/html; charset=utf-8
        statusCode: 503
        body:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: upstream-error-body
