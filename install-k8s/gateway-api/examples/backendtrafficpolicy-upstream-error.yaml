# Envoy 把 response body 当格式串：HTML/CSS 里不能出现任何 % 字符
# 禁止：width:50%、border-radius:50%、keyframes 0%/100%
# 圆角用 px；动画用 from/to
apiVersion: v1
kind: ConfigMap
metadata:
  name: upstream-error-body
  namespace: default
data:
  response.body: |
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
      <meta charset="utf-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      <title>服务加载中</title>
      <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,"/>
      <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
          background: #f3f7f5;
          color: #1a1d21;
          overflow: hidden;
        }
        .orb {
          position: fixed;
          border-radius: 9999px;
          filter: blur(64px);
          pointer-events: none;
          z-index: 0;
        }
        .orb-a {
          width: 420px; height: 420px;
          top: -120px; right: -80px;
          background: #d7efe2;
          opacity: 0.88;
        }
        .orb-b {
          width: 360px; height: 360px;
          bottom: -140px; left: -90px;
          background: #e0f3e9;
          opacity: 0.92;
        }
        .card {
          position: relative;
          z-index: 1;
          width: 440px;
          max-width: 92vw;
          padding: 44px 36px 32px;
          background: rgba(255, 255, 255, 0.9);
          border: 1px solid rgba(255, 255, 255, 0.96);
          border-radius: 24px;
          text-align: center;
          box-shadow: 0 24px 60px rgba(60, 100, 78, 0.07), 0 2px 0 rgba(255, 255, 255, 0.85) inset;
          animation: rise 0.6s ease-out both;
        }
        .stage {
          position: relative;
          width: 88px; height: 88px;
          margin: 8px auto 28px;
        }
        .glow {
          position: absolute;
          inset: 12px;
          border-radius: 9999px;
          background: #8fcea8;
          opacity: 0.16;
          filter: blur(12px);
          animation: pulse 1.8s ease-in-out infinite;
        }
        .ring {
          position: relative;
          width: 88px; height: 88px;
          animation: spin 1.1s linear infinite;
        }
        .dots { display: flex; justify-content: center; gap: 7px; margin: 18px 0 0; }
        .dots span {
          width: 6px; height: 6px;
          border-radius: 9999px;
          background: #b5dcc4;
          animation: blink 1.2s ease-in-out infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.16s; }
        .dots span:nth-child(3) { animation-delay: 0.32s; }
        .badge {
          display: inline-block;
          margin-bottom: 12px;
          padding: 4px 10px;
          border-radius: 9999px;
          background: #f0f8f3;
          color: #5aa87a;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.12em;
        }
        h1 {
          margin: 0 0 10px;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        p { margin: 0; color: #5b6570; font-size: 15px; line-height: 1.7; }
        .hint {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          margin-top: 26px;
          padding-top: 18px;
          border-top: 1px solid #eef4f0;
          font-size: 12px;
          color: #8a949e;
          letter-spacing: 0.08em;
        }
        .hint i {
          width: 6px; height: 6px;
          border-radius: 9999px;
          background: #8fcea8;
          box-shadow: 0 0 0 4px #eaf6ef;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { from { opacity: 0.08; transform: scale(0.92); } to { opacity: 0.2; transform: scale(1.08); } }
        @keyframes blink { from { opacity: 0.3; transform: translateY(2px); } to { opacity: 1; transform: translateY(-2px); } }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      </style>
    </head>
    <body>
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <main class="card">
        <div class="stage" aria-hidden="true">
          <div class="glow"></div>
          <svg class="ring" viewBox="0 0 88 88">
            <circle cx="44" cy="44" r="30" fill="none" stroke="#e6f2eb" stroke-width="5"/>
            <path d="M44 14 a30 30 0 0 1 30 30" fill="none" stroke="#8fcea8" stroke-width="5" stroke-linecap="round"/>
            <path d="M44 74 a30 30 0 0 1 -12 -3" fill="none" stroke="#c5e6d2" stroke-width="5" stroke-linecap="round"/>
            <circle cx="44" cy="44" r="7" fill="#8fcea8"/>
          </svg>
        </div>
        <div class="badge">HTTP 503</div>
        <h1>服务加载中</h1>
        <p>服务暂时不可用，网关正在等待故障恢复。<br/>感谢您的耐心等待！</p>
        <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="hint"><i></i> GATEWAY</div>
      </main>
    </body>
    </html>
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: upstream-error
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  responseOverride:
    - match:
        statusCodes:
          - type: Value
            value: 500
          - type: Value
            value: 502
          - type: Value
            value: 503
      source: Local
      response:
        contentType: text/html; charset=utf-8
        statusCode: 503
        body:
          type: ValueRef
          valueRef:
            group: ""
            kind: ConfigMap
            name: upstream-error-body
