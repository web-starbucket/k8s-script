# 业务 Pod 有 Ready 端点时使用：/website → website-ssr-beta
# 上游若返回 500/502/503，再用 backendtrafficpolicy-upstream-error.yaml 改成自定义 HTML
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-eg-website-ssr-beta
  namespace: default
spec:
  parentRefs:
    - name: eg
      namespace: default
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /website
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: website-ssr-beta
          port: 8094
