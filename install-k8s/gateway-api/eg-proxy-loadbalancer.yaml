# 可选：数据面改为 MetalLB LoadBalancer（默认 VIP 172.16.10.250）
# 不要与 API VIP 172.16.10.100 冲突
# 先 bash ../metallb/install-metallb.sh，再 bash ensure-envoy-loadbalancer.sh
# MetalLB 不允许同时写 spec.loadBalancerIP 和 metallb.universe.tf/loadBalancerIPs
#
# telemetry.tracing：数据面开 OTLP，%TRACE_ID% / x-trace-id 才有值（需集群里有 Tempo）
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-proxy
  namespace: envoy-gateway-system
spec:
  telemetry:
    tracing:
      # 排障可先 100；生产建议 1～10
      samplingRate: 100
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: tempo
            namespace: monitoring
            port: 4317
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.38.0
      envoyService:
        type: LoadBalancer
        annotations:
          metallb.universe.tf/loadBalancerIPs: "172.16.10.250"
        patch:
          type: StrategicMerge
          value:
            spec:
              type: LoadBalancer
              externalTrafficPolicy: Cluster
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: eg-proxy
    namespace: envoy-gateway-system
