# 可选：数据面改为 MetalLB LoadBalancer（默认 VIP 172.16.10.200）
# 不要与 API VIP 172.16.10.100 冲突
# 先 bash ../metallb/install-metallb.sh，再 bash ensure-envoy-loadbalancer.sh
# MetalLB 不允许同时写 spec.loadBalancerIP 和 metallb.universe.tf/loadBalancerIPs
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.38.0
      envoyService:
        type: LoadBalancer
        annotations:
          metallb.universe.tf/loadBalancerIPs: "172.16.10.200"
        patch:
          type: StrategicMerge
          value:
            spec:
              type: LoadBalancer
              externalTrafficPolicy: Cluster
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: eg-proxy
    namespace: envoy-gateway-system
